<link rel="stylesheet" href="style.css">

<form class="contact-form"
      name="contact-request"
      method="POST"
      action="/thank-you.html"
      data-netlify="true"
      netlify-honeypot="bot-field">

    <input type="hidden" name="form-name" value="contact-request">

    <p hidden>
        <input name="bot-field">
    </p>

    <input type="text"
           name="company_name"
           placeholder="Company Name"
           required>

    <input type="text"
           name="contact_name"
           placeholder="Contact Name"
           required>

    <input type="email"
           name="email"
           placeholder="Email Address"
           required>

    <input type="tel"
           name="phone"
           placeholder="Phone Number"
           required>

    <select name="service_interest" required>
        <option value="">Select Service</option>
        <option>Dispatch Services</option>
        <option>Owner Operator Support</option>
        <option>Box Truck Dispatch</option>
        <option>Power Only Dispatch</option>
        <option>Dry Van Dispatch</option>
        <option>General Information</option>
    </select>

    <input type="text"
           name="mc_number"
           placeholder="MC Number (Optional)">

    <textarea name="message"
              rows="6"
              placeholder="Tell us how we can help..."
              required></textarea>

    <button type="submit">
        Submit Request
    </button>

</form>

<div class="chat-section">

    <h2>Need Immediate Assistance?</h2>

    <p>
        Chat with one of our representatives for answers about
        dispatch services, onboarding, carrier requirements,
        available lanes, and general questions.
    </p>

    <a href="tel:+18005551234" class="chat-btn">
        💬 Call Dispatch
    </a>

</div>
